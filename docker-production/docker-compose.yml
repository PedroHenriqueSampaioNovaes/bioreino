name: bioreino-fullstack

services:
  nginx:
    container_name: container-bioreino-nginx
    image: nginx:1.28.3-alpine3.23-perl
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      - ../nginx/ssl:/etc/nginx/ssl
    depends_on:
      - server
      - client

  server:
    container_name: container-bioreino-server
    build:
      context: ../
      dockerfile: server/Dockerfile
      args:
        - CLIENT_ORIGIN_URL=https://bioreino.com.br
    image: pedrosampaionovaes/bioreino-server:1.0
    env_file:
      - ../server/.env.local

  client:
    container_name: container-bioreino-client
    build:
      context: ../
      dockerfile: client/Dockerfile
      args:
        - NEXT_PUBLIC_API=https://bioreino.com.br
    image: pedrosampaionovaes/bioreino-client:1.0
    env_file:
      - ../client/.env
    depends_on:
      - server
